<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fleuriste — Accueil</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;margin:0;background:#111;color:#eee}
    .wrap{max-width:920px;margin:24px auto;padding:16px}
    .card{background:#1b1b1b;border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
    .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
    video{width:100%;max-height:420px;border-radius:12px;background:#000}
    .btn{display:inline-block;background:#22c55e;color:#111;font-weight:700;padding:12px 20px;border-radius:10px;text-decoration:none}
    .btn:hover{filter:brightness(1.1)}
    .upload{background:#131313;border:1px solid #333;border-radius:12px;padding:14px}
    input[type=file]{color:#ddd}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Bienvenue 🌸</h1>
    <div class="row">
      <div class="card" style="flex:2 1 560px;">
        {% if video %}
          <video controls autoplay muted loop playsinline>
            <source src="{{ video.file.url }}" type="video/mp4">
          </video>
        {% else %}
          <div style="padding:32px;text-align:center;opacity:.8">
            <p>Aucune vidéo pour le moment.</p>
            <p>Charge une vidéo ci-dessous.</p>
          </div>
        {% endif %}
        <div style="margin-top:16px">
          <a class="btn" href="{% url 'bouquets' %}">Start</a>
        </div>
      </div>

      <div class="card upload" style="flex:1 1 260px;">
        <h3>Uploader une vidéo</h3>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.file }}
          <div style="margin-top:10px">
            <button class="btn" type="submit">Uploader</button>
          </div>
        </form>
        <p style="font-size:12px;opacity:.7;margin-top:8px">
          Formats: MP4, WEBM, OGG (selon navigateur).
        </p>
      </div>
    </div>
  </div>
</body>
</html>
